<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <!-- malla de rombos (punto de arcos) -->
    <pattern id="malla" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="26" height="26" fill="#e9d6b6"/>
      <path d="M0 0 H26 M0 0 V26" stroke="#c8a26a" stroke-width="2"/>
    </pattern>
    <linearGradient id="fleco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe6d4"/>
      <stop offset="1" stop-color="#d9c9ab"/>
    </linearGradient>
    <clipPath id="tri">
      <polygon points="150,150 810,150 480,540"/>
    </clipPath>
  </defs>

  <rect width="960" height="760" fill="#fbf8f2"/>

  <!-- título -->
  <text x="480" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#5a4a2f">Chal Triangular de Red con Flecos «Encanto»</text>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#8a7550">Esquema · se teje de la punta hacia arriba</text>

  <!-- FLECOS lado izquierdo (borde diagonal izq: de 150,150 a 480,540) -->
  <g stroke="url(#fleco)" stroke-width="6" stroke-linecap="round">
    <line x1="168" y1="171" x2="150" y2="270"/>
    <line x1="205" y1="214" x2="188" y2="316"/>
    <line x1="242" y1="257" x2="226" y2="360"/>
    <line x1="279" y1="300" x2="264" y2="404"/>
    <line x1="316" y1="343" x2="302" y2="448"/>
    <line x1="353" y1="386" x2="340" y2="492"/>
    <line x1="390" y1="429" x2="378" y2="536"/>
    <line x1="427" y1="472" x2="416" y2="580"/>
    <line x1="464" y1="515" x2="455" y2="624"/>
  </g>
  <!-- FLECOS lado derecho (borde diagonal der: de 810,150 a 480,540) -->
  <g stroke="url(#fleco)" stroke-width="6" stroke-linecap="round">
    <line x1="792" y1="171" x2="810" y2="270"/>
    <line x1="755" y1="214" x2="772" y2="316"/>
    <line x1="718" y1="257" x2="734" y2="360"/>
    <line x1="681" y1="300" x2="696" y2="404"/>
    <line x1="644" y1="343" x2="658" y2="448"/>
    <line x1="607" y1="386" x2="620" y2="492"/>
    <line x1="570" y1="429" x2="582" y2="536"/>
    <line x1="533" y1="472" x2="544" y2="580"/>
    <line x1="496" y1="515" x2="505" y2="624"/>
  </g>
  <!-- fleco de la punta -->
  <g stroke="url(#fleco)" stroke-width="6" stroke-linecap="round">
    <line x1="480" y1="540" x2="472" y2="650"/>
    <line x1="480" y1="540" x2="480" y2="655"/>
    <line x1="480" y1="540" x2="488" y2="650"/>
  </g>

  <!-- cuerpo del chal (triángulo con malla) -->
  <polygon points="150,150 810,150 480,540" fill="url(#malla)" stroke="#a5814f" stroke-width="3"/>

  <!-- cota borde superior -->
  <line x1="150" y1="120" x2="810" y2="120" stroke="#5a4a2f" stroke-width="1.5"/>
  <line x1="150" y1="112" x2="150" y2="128" stroke="#5a4a2f" stroke-width="1.5"/>
  <line x1="810" y1="112" x2="810" y2="128" stroke="#5a4a2f" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" font-size="17" font-weight="600" fill="#5a4a2f">borde superior (hombros) ≈ 150–160 cm</text>

  <!-- cota profundidad -->
  <line x1="875" y1="150" x2="875" y2="540" stroke="#5a4a2f" stroke-width="1.5"/>
  <line x1="867" y1="150" x2="883" y2="150" stroke="#5a4a2f" stroke-width="1.5"/>
  <line x1="867" y1="540" x2="883" y2="540" stroke="#5a4a2f" stroke-width="1.5"/>
  <text x="905" y="350" text-anchor="middle" font-size="16" font-weight="600" fill="#5a4a2f" transform="rotate(90 905 350)">profundidad ≈ 65–70 cm</text>

  <!-- cota flecos -->
  <line x1="120" y1="540" x2="120" y2="640" stroke="#8a7550" stroke-width="1.5"/>
  <line x1="112" y1="540" x2="128" y2="540" stroke="#8a7550" stroke-width="1.5"/>
  <line x1="112" y1="640" x2="128" y2="640" stroke="#8a7550" stroke-width="1.5"/>
  <text x="70" y="596" text-anchor="middle" font-size="14" fill="#8a7550" transform="rotate(90 70 596)">flecos ≈ 28–30 cm</text>

  <!-- etiquetas -->
  <text x="286" y="300" text-anchor="middle" font-size="15" fill="#5a4a2f" transform="rotate(49 286 300)">flecos en el lado ▸</text>
  <text x="674" y="300" text-anchor="middle" font-size="15" fill="#5a4a2f" transform="rotate(-49 674 300)">◂ flecos en el lado</text>
  <text x="480" y="300" text-anchor="middle" font-size="16" font-weight="600" fill="#6b5735">red de arcos</text>
  <text x="480" y="322" text-anchor="middle" font-size="13" fill="#6b5735">(cad 5 + pb)</text>

  <!-- inset: motivo de arcos -->
  <g transform="translate(150,624)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#5a4a2f">Punto de arcos:</text>
    <g fill="none" stroke="#a5814f" stroke-width="2.5">
      <path d="M10 30 q22 -34 44 0"/>
      <path d="M54 30 q22 -34 44 0"/>
      <path d="M98 30 q22 -34 44 0"/>
      <path d="M32 55 q22 -34 44 0"/>
      <path d="M76 55 q22 -34 44 0"/>
    </g>
    <g fill="#6b5735">
      <circle cx="10" cy="30" r="3"/><circle cx="54" cy="30" r="3"/><circle cx="98" cy="30" r="3"/><circle cx="142" cy="30" r="3"/>
      <circle cx="32" cy="55" r="3"/><circle cx="76" cy="55" r="3"/><circle cx="120" cy="55" r="3"/>
    </g>
    <text x="160" y="34" font-size="12.5" fill="#6b5735">cad 5 = 1 arco</text>
    <text x="160" y="52" font-size="12.5" fill="#6b5735">● = pb que sujeta el arco</text>
  </g>
</svg>
